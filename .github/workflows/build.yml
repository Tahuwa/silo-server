name: Build patched Silo image

# Follows the official ghcr.io/silo-server/silo-server:latest image: whenever
# upstream ships a new build, rebuild that exact source commit with the
# artwork-quality patch (patch/apply.py) and publish it to this repo's package.

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if this upstream build already has a patched image
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "patch/**"
      - "scripts/**"
      - ".github/workflows/build.yml"

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  UPSTREAM_IMAGE: ghcr.io/silo-server/silo-server
  UPSTREAM_REPO: https://github.com/Silo-Server/silo-server.git

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Resolve upstream build
        id: upstream
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A patch change (push) or a manual force rebuilds even when the
          # upstream build is already covered.
          FORCE: ${{ github.event_name == 'push' || inputs.force == true }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          # Upstream's own image is public — read its labels anonymously.
          labels=$(GHCR_USER= GHCR_TOKEN= python3 scripts/registry.py labels "$UPSTREAM_IMAGE:latest")
          rev=$(jq -r '."org.opencontainers.image.revision" // empty' <<<"$labels")
          version=$(jq -r '."org.opencontainers.image.version" // empty' <<<"$labels")
          if [[ ! "$rev" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::upstream latest has no usable revision label: $labels"
            exit 1
          fi
          build_number="${version#build-}"
          [[ "$build_number" =~ ^[0-9]+$ ]] || build_number=""

          skip=false
          if [[ "$FORCE" != "true" ]] && python3 scripts/registry.py exists "$image:$rev"; then
            skip=true
          fi

          {
            echo "image=$image"
            echo "rev=$rev"
            echo "version=$version"
            echo "build_number=$build_number"
            echo "skip=$skip"
          } >> "$GITHUB_OUTPUT"
          echo "Upstream latest: ${version:-?} (${rev}) — skip=${skip}"

      - name: Already built
        if: steps.upstream.outputs.skip == 'true'
        run: echo "::notice::${{ steps.upstream.outputs.version }} (${{ steps.upstream.outputs.rev }}) already has a patched image."

      - name: Check out upstream source
        if: steps.upstream.outputs.skip != 'true'
        env:
          REV: ${{ steps.upstream.outputs.rev }}
        run: |
          set -euo pipefail
          git init -q src
          git -C src fetch -q --depth 1 "$UPSTREAM_REPO" "$REV"
          git -C src checkout -q FETCH_HEAD
          git -C src log -1 --format='Building %H — %s'

      - name: Apply patch
        if: steps.upstream.outputs.skip != 'true'
        run: |
          python3 patch/apply.py src
          git -C src --no-pager diff --stat

      - name: Set up Go
        if: steps.upstream.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Verify patched behaviour
        if: steps.upstream.outputs.skip != 'true'
        working-directory: src
        run: go test ./internal/imagesize/ -run 'TestHQPatch' -count=1 -v

      - name: Set up Docker Buildx
        if: steps.upstream.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.upstream.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build date
        if: steps.upstream.outputs.skip != 'true'
        id: date
        run: echo "now=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: steps.upstream.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_REVISION=${{ steps.upstream.outputs.rev }}
            BUILD_NUMBER=${{ steps.upstream.outputs.build_number }}
            BUILD_DATE=${{ steps.date.outputs.now }}
          tags: |
            ${{ steps.upstream.outputs.image }}:latest
            ${{ steps.upstream.outputs.image }}:${{ steps.upstream.outputs.rev }}
            ${{ steps.upstream.outputs.version && format('{0}:{1}', steps.upstream.outputs.image, steps.upstream.outputs.version) || '' }}
          labels: |
            org.opencontainers.image.title=silo-server (artwork quality patch)
            org.opencontainers.image.description=Silo Server ${{ steps.upstream.outputs.version }} with higher-quality artwork caching. Patch: ${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.upstream.outputs.rev }}
            org.opencontainers.image.version=${{ steps.upstream.outputs.version }}-hq
            org.opencontainers.image.created=${{ steps.date.outputs.now }}
            org.opencontainers.image.licenses=AGPL-3.0
            io.github.tahuwa.patch-commit=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: steps.upstream.outputs.skip != 'true'
        run: |
          {
            echo "### Published ${{ steps.upstream.outputs.image }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Upstream build | ${{ steps.upstream.outputs.version }} |"
            echo "| Upstream commit | [\`${{ steps.upstream.outputs.rev }}\`](https://github.com/Silo-Server/silo-server/commit/${{ steps.upstream.outputs.rev }}) |"
            echo "| Tags | \`latest\`, \`${{ steps.upstream.outputs.rev }}\`, \`${{ steps.upstream.outputs.version }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
